name = "uefa-app-production"
compatibility_date = "2025-07-11"
main = "worker.js"                 

[[routes]]
pattern = "api.uefaresults.com"
zone_id = "fd4555f4b7101c5d8895f808418eef29"
custom_domain = true

[observability.logs]
enabled = true


[[d1_databases]]
binding = "core_data"
database_name = "core-db"
database_id = "09b42559-8b10-4ee0-b3b0-af0d5a5f3609"


[[durable_objects.bindings]]
name = "NOTIF_HUB"
class_name = "NotificationHub"


# Each time you add/rename a DO class, add a NEW [[migrations]] entry with a new tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["NotificationHub"]