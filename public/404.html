<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00020c" />
  <meta name="robots" content="noindex">
  <title>Page not found | UEFA Results</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00020c;
      color: #ffffff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    main {
      padding: 24px;
      max-width: 520px;
    }

    .code {
      font-size: 72px;
      font-weight: 700;
      margin: 0;
      color: #6f82ff;
    }

    h1 {
      font-size: 24px;
      margin: 8px 0 12px;
    }

    p {
      color: #b9bfd6;
      line-height: 1.5;
    }

    .cta {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 22px;
      border-radius: 8px;
      background: #2a43fe;
      color: #ffffff;
      font-weight: 600;
      text-decoration: none;
    }

    nav {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
    }

    nav a {
      color: #8fa0ff;
    }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The page you are looking for does not exist or has been moved.</p>
    <a class="cta" href="/">Go to UEFA Results →</a>
    <nav>
      <a href="/live-scores/">Live scores</a>
      <a href="/custom-leagues/">Custom leagues</a>
      <a href="/about/">About</a>
