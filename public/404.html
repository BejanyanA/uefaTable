<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00020c" />
  <meta name="robots" content="noindex">
  <title>Page not found | UEFA Results</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #00020c;
      color: rgba(255, 255, 255, 0.85);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }

    main {
      padding: 24px;
      max-width: 520px;
    }

    .code {
      font-size: 72px;
      font-weight: 700;
      margin: 0;
      color: #40c456;
    }

    h1 {
      font-size: 24px;
      color: #ffffff;
      margin: 8px 0 12px;
    }

    p {
      color: rgba(255, 255, 255, 0.85);
      line-height: 1.6;
    }

    .cta {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 28px;
      border-radius: 10px;
      background: #40c456;
      color: #04210d;
      font-weight: 700;
      text-decoration: none;
    }

    .cta:hover {
      filter: brightness(1.08);
    }

    nav {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 20px;
      justify-content: center;
    }

    nav a {
      color: #2a43fed8;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <main>
    <p class="code">404</p>
    <h1 id="nfTitle">Page not found</h1>
    <p id="nfText">The page you are looking for does not exist or has been moved.</p>
    <a class="cta" id="nfHome" href="/">Go to UEFA Results →</a>
    <nav>
      <a id="nfLive" href="/live-scores/">Live scores</a>
      <a id="nfCustom" href="/custom-leagues/">Custom leagues</a>
      <a id="nfAbout" href="/about/">About</a>
      <a id="nfContact" href="/contact/">Contact</a>
    </nav>
  </main>

  <!-- Translate the page for /am/... and /fr/... URLs. It runs during parsing,
       so the page never shows in English first. data-cfasync="false" keeps
       Cloudflare Rocket Loader from delaying it. -->
  <script data-cfasync="false">
    (function () {
      var lang = location.pathname.split('/')[1];
      var T = {
        fr: {
          title: "Page introuvable | UEFA Results",
          nfTitle: "Page introuvable",
          nfText: "La page que vous recherchez n'existe pas ou a été déplacée.",
          nfHome: "Aller sur UEFA Results →",
          nfLive: "Scores en direct",
          nfCustom: "Ligues personnalisées",
          nfAbout: "À propos",
          nfContact: "Contact"
        },
        am: {
          title: "Էջը չի գտնվել | UEFA Results",
          nfTitle: "Էջը չի գտնվել",
          nfText: "Ձեր փնտրած էջը գոյություն չունի կամ տեղափոխվել է։",
          nfHome: "Անցնել UEFA Results →",
          nfLive: "Ուղիղ հաշիվներ",
          nfCustom: "Անհատական լիգաներ",
          nfAbout: "Մեր մասին",
          nfContact: "Կապ"
        }
      };
      var t = T[lang];
      if (!t) return;

      document.documentElement.lang = lang === 'am' ? 'hy' : lang;
      document.title = t.title;
      for (var id in t) {
        var el = document.getElementById(id);
        if (el) el.textContent = t[id];
      }

      var hrefs = {
        nfHome: '', nfLive: '/live-scores/', nfCustom: '/custom-leagues/',
        nfAbout: '/about/', nfContact: '/contact/'
      };
      for (var linkId in hrefs) {
        var link = document.getElementById(linkId);
        if (link) link.setAttribute('href', '/' + lang + hrefs[linkId]);
      }
    })();
  </script>
</body>

</html>
