<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Table UEFA</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/icons/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="css/layout/header.css">
  <link rel="stylesheet" href="css/layout/footer.css">
  <link rel="stylesheet" href="css/components/auth.css">
  <link rel="stylesheet" href="css/components/modal.css">
  <link rel="stylesheet" href="css/components/language-switcher.css">
  <link rel="stylesheet" href="css/components/toast.css" />
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div id="overlay" class="overlay"></div>

  <!-- Header  -->
  <header>
    <div class="language-auth-group">
      <div class="language-switcher">
        <img src="assets/flags/en.svg" id="langTrigger" class="lang-flag" onclick="toggleDropdown()" />
        <div id="langDropdown" class="dropdown-menu">
          <div class="language-option" onclick="setLanguage('en')">
            <img src="assets/flags/en.svg" />
            <span>English</span>
          </div>
          <div class="language-option" onclick="setLanguage('am')">
            <img src="assets/flags/am.svg" />
            <span>Հայերեն</span>
          </div>
          <div class="language-option" onclick="setLanguage('fr')">
            <img src="assets/flags/fr.svg" />
            <span>Français</span>
          </div>
        </div>
      </div>
      <div class="auth-buttons" style="display: none;" id="authButtons">
        <button onclick="openModal('loginModal')" id="loginBtn">Login</button>
        <button onclick="openModal('registerModal')" id="registerBtn">Sign Up</button>
      </div>
    </div>
    <div class="logoutButtn">
      <section id="logoutButtn" style="display: none;">
        <div class="logout-button">
          <button onclick="logout()" id="logoutBtn">Logout</button>
        </div>
      </section>
    </div>
  </header>

  <!-- Login Modal  -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2 id="loginTitle">Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <input type="text" id="loginEmail" />
          <label for="loginEmail" id="loginEmailLabel"></label>
        </div>
        <div class="error" id="loginEmailError"></div>

        <div class="password-wrapper">
          <div class="input-group">
            <input type="password" id="loginPassword" />
            <label for="loginPassword" id="loginPasswordLabel"></label>
          </div>
          <img src="assets/icons/eye.svg" class="toggle-password" onclick="togglePassword('loginPassword', this)" />
        </div>
        <div class="error" id="loginPasswordError"></div>

        <button type="submit" id="loginSubmit">Login</button>
      </form>
    </div>
  </div>

  <!-- Registration Modal  -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('registerModal')">&times;</span>
      <h2 id="registerTitle">Register</h2>
      <form id="registerForm">
        <div class="input-group">
          <input type="text" id="regUsername" />
          <label for="regUsername" id="regUsernameLabel"></label>
        </div>
        <div class="error" id="regUsernameError"></div>

        <div class="input-group">
          <input type="text" id="regEmail" />
          <label for="regEmail" id="regEmailLabel"></label>
        </div>
        <div class="error" id="regEmailError"></div>

        <div class="password-wrapper">
          <div class="input-group">
            <input type="password" id="regPassword" />
            <label for="regPassword" id="regPasswordLabel"></label>
          </div>
          <img src="assets/icons/eye.svg" class="toggle-password" onclick="togglePassword('regPassword', this)" />
        </div>
        <div class="error" id="regPasswordError"></div>

        <div class="password-wrapper">
          <div class="input-group">
            <input type="password" id="regConfirmPassword" />
            <label for="regConfirmPassword" id="regConfirmPasswordLabel"></label>
          </div>
          <img src="assets/icons/eye.svg" class="toggle-password"
            onclick="togglePassword('regConfirmPassword', this)" />
        </div>
        <div class="error" id="regConfirmPasswordError"></div>

        <button type="submit" id="registerSubmit">Submit</button>
      </form>
    </div>
  </div>

  <!-- 🔹 Banners -->
  <div class="homePage" id="homePage" style="display: none; ">
    <div class="banner-container">
      <img src="assets/images/banner1.jpg" class="banner" data-table-id="table1" />
    </div>
  </div>

  <!-- Modal -->
  <div class="modal" id="tableModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('tableModal')">&times;</span>
      <h2 id="actionTitle">Table Actions</h2>

      <form id="actionForm" onsubmit="return false;">
        <div class="auth-buttons" id="actionButtons">
          <button type="button" id="createBtn">Create</button>
          <button type="button" id="openBtn">Open</button>
        </div>

        <div class="password-wrapper" id="openTableSection" style="display: none;">
          <div class="input-group">
            <input type="password" id="tablePassword" />
            <label for="tablePassword" id="tablePasswordLabel"></label>
          </div>
          <img src="assets/icons/eye.svg" class="toggle-password" onclick="togglePassword('tablePassword', this)" />
        </div>
        <div class="error" id="tablePasswordError"></div>

        <button type="submit" id="confirmOpenBtn" class="modal-content modal form button">Submit</button>

      </form>
    </div>
  </div>

  <!-- 🔹 Game Table Section -->
  <div id="gameTableSection" style="display: none;">
    <!-- Populated dynamically -->
  </div>

  <footer>
    Powered by And Bejanyan © 2025 All rights reserved
  </footer>

  <!-- Load language system, validations, then main logic -->
  <script type="module" src="js/app.js"></script>
</body>

</html>
