  <link rel="stylesheet" href="css/components/checkbox-lists.css">
  <link rel="stylesheet" href="css/components/instances.css">
  <link rel="stylesheet" href="css/components/standings.css">
  <link rel="stylesheet" href="css/components/matches.css">
  <link rel="stylesheet" href="css/components/delete-modal.css">
  <link rel="stylesheet" href="css/components/edit-modal.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="content-wrapper">

      <!-- Header  -->
      <header>
        <div class="language-auth-group">
          <div class="language-switcher">
            <img src="assets/flags/en.svg" id="langTrigger" class="lang-flag" onclick="toggleDropdown()" />
            <div id="langDropdown" class="dropdown-menu">
              <div class="language-option" onclick="setLanguage('en')">
                <img src="assets/flags/en.svg" />
                <span>English</span>
              </div>
              <div class="language-option" onclick="setLanguage('am')">
                <img src="assets/flags/am.svg" />
                <span>Հայերեն</span>
              </div>
              <div class="language-option" onclick="setLanguage('fr')">
                <img src="assets/flags/fr.svg" />
                <span>Français</span>
              </div>
            </div>
          </div>
          <div class="auth-buttons" style="display: none;" id="authButtons">
            <button onclick="openModal('loginModal')" id="loginBtn">Login</button>
            <button onclick="openModal('registerModal')" id="registerBtn">Sign Up</button>
          </div>
        </div>
        <div class="logoutButtn">
          <section id="logoutButtn" style="display: none;">
            <div class="logout-button">
              <button onclick="logout()" id="logoutBtn">Logout</button>
            </div>
          </section>
        </div>
      </header>

      <!-- Login Modal  -->
      <div class="modal" id="loginModal">
        <div class="modal-content">
          <span class="close" onclick="closeModal('loginModal')">&times;</span>
          <h2 id="loginTitle">Login</h2>
          <form id="loginForm">
            <div class="input-group input-league-name">
              <input type="text" id="loginEmail" placeholder=" "/>
              <label for="loginEmail" id="loginEmailLabel"></label>
            </div>
            <div class="error" id="loginEmailError"></div>

            <div class="input-league-name">
              <div class="input-group submit-button">
                <input type="password" id="loginPassword" placeholder=" "/>
                <label for="loginPassword" id="loginPasswordLabel"></label>
              </div>
              <img src="assets/icons/eye.svg" class="toggle-password" onclick="togglePassword('loginPassword', this)" />
            </div>
            <div class="error" id="loginPasswordError"></div>

            <button type="submit" class="submit-button" id="loginSubmit">Login</button>
          </form>
        </div>
      </div>

      <!-- Registration Modal  -->
      <div class="modal" id="registerModal">
        <div class="modal-content">
          <span class="close" onclick="closeModal('registerModal')">&times;</span>
          <h2 id="registerTitle">Register</h2>
          <form id="registerForm">
            <div class="input-group input-league-name">
              <input type="text" id="regUsername" placeholder=" "/>
              <label for="regUsername" id="regUsernameLabel"></label>
            </div>
            <div class="error" id="regUsernameError"></div>

            <div class="input-group input-league-name">
              <input type="text" id="regEmail" placeholder=" "/>
              <label for="regEmail" id="regEmailLabel"></label>
            </div>
            <div class="error" id="regEmailError"></div>

            <div class="input-league-name">
              <div class="input-group">
                <input type="password" id="regPassword" placeholder=" "/>
                <label for="regPassword" id="regPasswordLabel"></label>
              </div>
              <img src="assets/icons/eye.svg" class="toggle-password" onclick="togglePassword('regPassword', this)" />
            </div>
            <div class="error" id="regPasswordError"></div>

            <div class="input-league-name">
              <div class="input-group">
                <input type="password" id="regConfirmPassword" placeholder=" "/>
                <label for="regConfirmPassword" id="regConfirmPasswordLabel"></label>
              </div>
              <img src="assets/icons/eye.svg" class="toggle-password"
                onclick="togglePassword('regConfirmPassword', this)" />
            </div>
            <div class="error" id="regConfirmPasswordError"></div>

            <button type="submit" id="registerSubmit">Submit</button>
          </form>
        </div>
      </div>

      <!-- 🔹 Home Page Banners -->
      <div class="homePage" id="homePage" style="display: none; ">
        <div class="banner-container" id="bannerContainer">
          <div id="bannerContainerWrapper ">
            <h2 id="competition-types">Competition Types</h2>
          </div>
          <div class="banner-wrap" id="banner-wrap">
            <div id="banner1" class="banner" banner-id="1">
              <h2 id="banner-title">Champions League</h2>
            </div>
            <div id="banner2" class="banner" banner-id="2">
              <h2 id="banner-title">Europe League</h2>
            </div>
            <div id="banner3" class="banner" banner-id="3">
              <h2 id="banner-title">EURO Cup</h2>
            </div>
            <div id="banner4" class="banner" banner-id="4">
              <h2 id="banner-title">WORLD Cup</h2>
            </div>
          </div>
        </div>
      </div>

      <!-- Modal -->
      <div class="modal" id="tableModal">
        <div class="modal-content" id="modal-content">
          <div class="actionTitle">
            <h2 id="actionTitle">Table Actions</h2>
          </div>
          <div class="createCompetition">
            <h2 id="createCompetition">Create Competition</h2>
          </div>
          <span class="close" onclick="closeModal('tableModal')">&times;</span>

          <form id="actionForm" onsubmit="return false;">

            <div class="action-table-buttons" id="actionButtons">
              <button type="button" id="createBtn">Create</button>
              <button type="button" id="openBtn">Open</button>
            </div>

            <div class="input-league-name" id="openCreateSection">
              <div class="input-group">
                <input type="text" id="leagueName" placeholder=" "/>
                <label for="leagueName" id="leagueNameLabel"></label>
              </div>
            </div>
            <div class="error" id="leagueNameError"></div>

            <!-- Friends list -->
            <div id="user-select" class="friend-checkbox-list"></div>

            <div id="friendError" class="friend-list-error" style="display: none;"></div>

            <!-- Single Select Dropdown -->
            <select id="count-select" class="modal-dropdown">
              <option class="teamCount" id="count-text">Select Team Count</option>
              <option class="teamCount" value="32">32</option>
              <option class="teamCount" value="64">64</option>
            </select>
            <div id="teamCountError" class="modal-dropdown-error"></div>

            <!-- Clubs list -->
            <div class="club-search">
              <input type="text" id="clubSearch" placeholder=" "/>
              <label for="clubSearch" id="clubSearchLabel"></label>
            </div>
            <div id="clubCount" class="club-count">Selected</div>
            <div id="clubList" class="club-checkbox-list club-list-scroll">
              <div class="clubs-list-error"></div>
            </div>
            <div id="clubsError" class="clubs-error"></div>

            <button type="submit" id="confirmCreateBtn" class="modal-content modal form button">Submit</button>

          </form>
        </div>
      </div>

      <!-- 🔹 Leagues -->
      <section id="leagueType1" style="display: none;">
        <!-- Populated dynamically -->
        <button id="backBtn">⬅ Back</button>
        <div id="leagueGroupsWrapper" class="league-background-wrapper" style="display: none;"></div>
        <div class="group-tabs">
        </div>
        <div class="tab-content" data-content="standings"></div>
        <div class="tab-content hidden" data-content="matches"></div>
      </section>
    </div>

    <div id="deleteModal" class="delete-modal hidden">
      <div class="delete-modal-content">
        <h3 id="deleteModalTitle"></h3>
        <p id="deleteModalText"></p>
        <div class="delete-modal-buttons">
          <button id="confirmDeleteBtn" class="confirm-delete-btn"></button>
          <button id="cancelBtn" class="cancel-btn"></button>
        </div>
      </div>
    </div>

    <div id="editModal" class="edit-modal hidden">
      <div class="edit-modal-content">
        <div class="editModalTitle">
          <h3 id="editLeagueTitle">Edit League</h3>
          <div class="edit-input-wrapper">
            <input id="leagueNameEdit" type="text" placeholder=" "/>
            <label for="leagueNameEdit" id="leagueNameEditlabel"></label>
          </div>
        </div>
        <div id="leagueNameUpdateError" class="edit-error"></div>

        <div>
          <h4 id="usersWithAccess"></h4>
          <div id="accessUsersContainer" class="user-list"></div>
        </div>

        <div>
          <h4 id="friends"></h4>
          <div id="friendsListContainer" class="user-list"></div>
        </div>

        <div class="edit-modal-buttons">
          <button id="cancelEditBtn" class="cancel-btn"></button>
          <button type="submit" id="confirmEditBtn" class="confirm-edit-btn"></button>
        </div>
      </div>
    </div>


    <footer class="page-footer">
      All rights reserved
    </footer>

    <!-- Load language system, validations, then main logic -->
    <script type="module" src="js/app.js"></script>
  </div>
</body>

</html>
