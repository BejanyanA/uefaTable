<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Auth</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/toast.css" />
</head>

<body>
  <div id="overlay" class="overlay"></div>

  <!-- Header  -->
  <header>
    <div class="language-auth-group">
      <div class="language-switcher">
        <img src="assets/en.svg" id="langTrigger" class="lang-flag" onclick="toggleDropdown()" />
        <div id="langDropdown" class="dropdown-menu">
          <div class="language-option" onclick="setLanguage('en')">
            <img src="assets/en.svg" />
            <span>English</span>
          </div>
          <div class="language-option" onclick="setLanguage('am')">
            <img src="assets/am.svg" />
            <span>Հայերեն</span>
          </div>
          <div class="language-option" onclick="setLanguage('fr')">
            <img src="assets/fr.svg" />
            <span>Français</span>
          </div>
        </div>
      </div>
      <div class="auth-buttons" style="display: none;" id="authButtons">
        <button onclick="openModal('loginModal')" id="loginBtn">Login</button>
        <button onclick="openModal('registerModal')" id="registerBtn">Sign Up</button>
      </div>
    </div>
    <section id="logoutButtn" style="display: none;">
      <div class="logout-button">
        <button onclick="logout()" id="logoutBtn">Logout</button>
      </div>
    </section>
  </header>

  <h2 id="welcomeUser">Welcome!</h2>

  <!-- Login Modal  -->
  <div class="modal" id="loginModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('loginModal')">&times;</span>
      <h2 id="loginTitle">Login</h2>
      <form id="loginForm">
        <div class="input-group">
          <input type="text" id="loginEmail" />
          <label for="loginEmail" id="loginEmailLabel"></label>
        </div>
        <div class="error" id="loginEmailError"></div>

        <div class="password-wrapper">
          <div class="input-group">
            <input type="password" id="loginPassword" />
            <label for="password" id="loginPasswordLabel"></label>
          </div>
          <img src="assets/eye.svg" class="toggle-password" onclick="togglePassword('loginPassword', this)" />
        </div>
        <div class="error" id="loginPasswordError"></div>

        <button type="submit" id="loginSubmit">Login</button>
      </form>
    </div>
  </div>

  <!-- Registration Modal  -->
  <div class="modal" id="registerModal">
    <div class="modal-content">
      <span class="close" onclick="closeModal('registerModal')">&times;</span>
      <h2 id="registerTitle">Register</h2>
      <form id="registerForm">
        <div class="input-group">
          <input type="text" id="regUsername" />
          <label for="regUsername" id="regUsernameLabel"></label>
        </div>
        <div class="error" id="regUsernameError"></div>

        <div class="input-group">
          <input type="text" id="regEmail" />
          <label for="regEmail" id="regEmailLabel"></label>
        </div>
        <div class="error" id="regEmailError"></div>

        <div class="password-wrapper">
          <div class="input-group">
            <input type="password" id="regPassword" />
            <label for="password" id="regPasswordLabel"></label>
          </div>
          <img src="assets/eye.svg" class="toggle-password" onclick="togglePassword('regPassword', this)" />
        </div>
        <div class="error" id="regPasswordError"></div>

        <div class="password-wrapper">
          <div class="input-group">
            <input type="password" id="regConfirmPassword" />
            <label for="password" id="regConfirmPasswordLabel"></label>
          </div>
          <img src="assets/eye.svg" class="toggle-password" onclick="togglePassword('regConfirmPassword', this)" />
        </div>
        <div class="error" id="regConfirmPasswordError"></div>

        <button type="submit" id="registerSubmit">Submit</button>
      </form>
    </div>
  </div>

  <div class="homePage" id="homePage" style="display: none;">
    <!-- 🔹 Banners -->
    <div class="banner-container">
      <img src="assets/banner1.jpg" class="banner" data-table-id="table1" onclick="openModal('tableModal', this)" />
    </div>

    <!-- 🔹 Modal -->
    <div class="modal" id="tableModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('tableModal')">&times;</span>
        <h2 id="actionTitle">Table Actions</h2>
        <form id="actionForm">
          <button id="createBtn">Create</button>
          <button id="openBtn">Open</button>

          <div id="openTableSection" style="display: none;">
            <input type="text" id="tablePassword"/>
            <div class="error" id="tablePasswordError"></div>
            <button id="confirmOpenBtn">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <!-- 🔹 Game Table Section -->
  <div id="gameTableSection" style="display: none;">
    <!-- Populated dynamically -->
  </div>
  </div>

  <footer>
    Powered by And Bejanyan © 2025 All rights reserved
  </footer>

  <!-- Load language system, validations, then main logic -->
  <script src="js/lang.js" defer></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/register.js"></script>
  <script type="module" src="js/logout.js"></script>
  <script type="module" src="js/homepage.js"></script>

</body>

</html>
